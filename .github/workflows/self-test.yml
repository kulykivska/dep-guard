name: Self-test

# dep-guard runs its own checks against itself, so a broken script is caught
# here rather than in every consumer repo.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '30 6 * * 1'

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  guard:
    uses: ./.github/workflows/supply-chain.yml
    with:
      ref: ${{ github.sha }}

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck scripts/*.sh
